name: Test and publish cleaner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: armv7
            platform: linux/arm/v7
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'armv7'
        with:
          platforms: arm
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
      - name: Build image for target platform
        run: docker build --platform '${{ matrix.platform }}' -t cleaner-test:${{ matrix.arch }} .
      - name: Test real media and regression cases
        env:
          CLEANER_IMAGE: cleaner-test:${{ matrix.arch }}
        run: python3 -m unittest discover -s tests -v
      - name: Export the tested image
        run: docker save cleaner-test:${{ matrix.arch }} | gzip > cleaner-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: cleaner-${{ matrix.arch }}.tar.gz
          retention-days: 7

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check publishing configuration
        id: registry
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Images tested successfully; Docker Hub publication was skipped because DOCKERHUB_TOKEN is not configured in this repository.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.registry.outputs.configured == 'true'
        with:
          pattern: image-*
          path: images
      - uses: docker/setup-buildx-action@v3
        if: steps.registry.outputs.configured == 'true'
      - uses: docker/login-action@v3
        if: steps.registry.outputs.configured == 'true'
        with:
          username: seanriggs
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the exact tested images
        if: steps.registry.outputs.configured == 'true'
        env:
          IMAGE_NAME: seanriggs/advanced-ffprobe-m3u-cleaner
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for arch in amd64 arm64 armv7; do
            docker load -i "images/image-$arch/cleaner-$arch.tar.gz"
            docker tag "cleaner-test:$arch" "$IMAGE_NAME:sha-$COMMIT_SHA-$arch"
            docker push "$IMAGE_NAME:sha-$COMMIT_SHA-$arch"
          done
          docker buildx imagetools create \
            -t "$IMAGE_NAME:sha-$COMMIT_SHA" -t "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:sha-$COMMIT_SHA-amd64" \
            "$IMAGE_NAME:sha-$COMMIT_SHA-arm64" \
            "$IMAGE_NAME:sha-$COMMIT_SHA-armv7"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$COMMIT_SHA"
